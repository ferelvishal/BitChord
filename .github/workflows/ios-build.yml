name: iOS build

on:
  push:
    branches: [main, "ios/**"]
    paths:
      - "iosApp/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "iosApp/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: iosApp
        run: |
          xcodebuild -project BitChord.xcodeproj -scheme BitChord -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        working-directory: iosApp
        run: |
          xcodebuild -project BitChord.xcodeproj -scheme BitChord -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-Simulator
          path: iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/BitChord.app
          if-no-files-found: error
