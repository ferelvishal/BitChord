name: BitChord
options:
  bundleIdPrefix: in.bitchord
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: BitChord
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: BitChord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.bitchord.ios
        PRODUCT_NAME: BitChord
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

  BitChordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BitChordTests
    dependencies:
      - target: BitChord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.bitchord.ios.tests

schemes:
  BitChord:
    build:
      targets:
        BitChord: all
    test:
      targets:
        - BitChordTests
